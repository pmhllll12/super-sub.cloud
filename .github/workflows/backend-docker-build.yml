name: 백엔드 이미지 빌드·Docker Hub push

# main에 fastapi/ 변경이 들어갈 때만 돈다. EC2(supersub)는 이 이미지를
# 직접 pull하러 오지 않고, supersub-cd.timer가 2분마다 Docker Hub를
# 폴링하다가 새 digest를 감지하면 스스로 재배포한다
# (jekyll/pages/pending.markdown min 11번, www/docs/2026-09-09-K3S-harness.md).
on:
  push:
    branches: [main]
    paths:
      - "fastapi/**"
      - ".github/workflows/backend-docker-build.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: fastapi
          file: fastapi/Dockerfile
          push: true
          tags: pmhllll12/supersub:latest
