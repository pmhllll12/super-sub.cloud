{%- comment -%}
  다크 모드 단추 (2026-09-17). 첫 테마는 head_custom.html 이 정한다 — 여기는 바꾸기만 한다.
  고른 값은 이 브라우저에만 남는다(localStorage). 고른 적이 없으면 운영체제 설정을 계속 따른다.
{%- endcomment %}
<button type="button" class="theme-toggle" id="theme-toggle">다크 모드</button>
<script>
  (function () {
    var btn = document.getElementById('theme-toggle');
    var root = document.documentElement;

    function label(theme) {
      btn.textContent = theme === 'dark' ? '라이트 모드' : '다크 모드';
      btn.setAttribute('aria-label', theme === 'dark' ? '라이트 모드로 바꾸기' : '다크 모드로 바꾸기');
    }

    function apply(theme) {
      root.setAttribute('data-theme', theme);
      jtd.setTheme(theme === 'dark' ? 'dark' : 'default');
      label(theme);
    }

    function saved() {
      try { return localStorage.getItem('supersub-theme'); } catch (e) { return null; }
    }

    label(root.getAttribute('data-theme'));

    btn.addEventListener('click', function () {
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('supersub-theme', next); } catch (e) {}
      apply(next);
    });

    if (window.matchMedia) {
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var onChange = function (e) {
        var s = saved();
        if (s !== 'dark' && s !== 'light') apply(e.matches ? 'dark' : 'light');
      };
      if (mq.addEventListener) mq.addEventListener('change', onChange);
    }
  })();
</script>
