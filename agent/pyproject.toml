[project]
name = "supersub-agent"
version = "0.1.0"
description = "Super-Sub 자세 분석 AI 에이전트 — 포즈 측정 + 루브릭 판정 + 점수 합산"
requires-python = ">=3.12,<3.13"

dependencies = [
    # 판정 에이전트 (Hugging Face Transformers)
    # torch는 cu126 빌드로 고정한다. WSL2 GPU 드라이버가 CUDA 12.6(560.94)이라
    # 기본 PyPI 휠(cu130)은 "driver is too old"로 CUDA를 인식하지 못한다.
    "torch>=2.6,<2.9",
    # transformers는 5.x가 필요하다. 판정 모델 EXAONE 4.0 1.2B는 5.x에
    # 네이티브 통합되어 있어 trust_remote_code 없이 적재된다.
    # (EXAONE 3.5 계열은 원격 코드가 특정 버전 창에만 맞아 쓰지 않는다.)
    "transformers>=5.0",
    "accelerate>=1.0",
    # 4bit 양자화 — 기본 경로에서는 쓰지 않는다(1.2B는 bf16이 더 빠름).
    # Judge(quantize=True)로 더 큰 모델을 올릴 때만 필요하다.
    "bitsandbytes>=0.45",
    "outlines>=0.1",            # JSON 스키마 강제 (GBNF 대체)
    # 영상·포즈 (OpenCV + Transformers)
    "opencv-python>=4.10",
    "numpy>=1.26",
    "pillow>=10.0",
    # ViTPose 전처리기가 히트맵을 원본 좌표로 되돌릴 때 scipy.ndimage의
    # affine_transform을 쓴다. transformers가 이 임포트를 is_scipy_available()로
    # 감싸 두어, 없으면 임포트는 조용히 넘어가고 실행 시점에 NameError가 난다.
    # 선택 의존성처럼 보이지만 영상 경로에서는 필수다.
    "scipy>=1.14",
    # 루브릭·설정
    "pyyaml>=6.0",
    # API·시각화
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "matplotlib>=3.9",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# 추적 오버레이(scripts/track_overlay.py) 전용 — **기본 설치에 넣지 않는다.**
# ultralytics는 AGPL-3.0이라, 이 패키지를 링크한 채 서비스를 네트워크로
# 제공하면 소스 공개 의무가 생긴다. 분석 파이프라인 본체는 RT-DETR(Apache-2.0)로
# 돌아가므로 서비스 경로에는 영향이 없다. 검수용 시각화에만 쓴다.
# 상업 배포 전에 미결 항목 1번(EXAONE NC)과 함께 정리해야 한다.
#
# lap은 ByteTrack의 헝가리안 매칭에 쓰인다. ultralytics가 실행 시점에 자동으로
# 설치하는데(AutoUpdate), 그러면 팀원마다 설치 시점이 달라진다. 명시해 고정한다.
tracking = ["ultralytics>=8.3", "lap>=0.5"]

# PyTorch cu126 휠 인덱스 — 위 torch 주석 참고.
[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/supersub_agent"]
