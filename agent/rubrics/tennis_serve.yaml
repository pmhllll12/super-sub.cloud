# 테니스 서브 채점 루브릭
#
# ⚠️ 임계값은 **지도자 검수 전 임시값**이다 (미결 항목 2번).
# ⚠️ **실클립 미검증** — 파이프라인이 이 종목 영상에서 지표를 제대로 뽑는지
#    아직 확인하지 않았다.

sport: tennis
motion: serve
sport_ko: 테니스
motion_ko: 서브
version: 0.1
status: draft
review_required: true
pipeline_version: pose-v0.1
validated_on: ""

kinematics:
  impact_limb: arm
  impact_event: extension_peak

criteria:
  - id: contact_arm_extension
    name: 타점 팔 신전
    weight: 0.3
    rationale: >-
      서브는 닿을 수 있는 가장 높은 지점에서 맞아야 각도가 선다.
      팔이 접힌 채 맞으면 네트를 넘기려 궤도를 띄우게 된다.
    measured_by: [swing_elbow_angle_at_impact]
    titles:
      2: "최고점에서 맞은 서브"
      1: "낮아진 타점"
      0: "접힌 팔"
    grades:
      2: "타점에서 팔꿈치각 160~178도"
      1: "140~160도"
      0: "140도 미만"
    bands:
      metric: swing_elbow_angle_at_impact
      2: [[160, 178]]
      1: [[140, 160]]
      0: [[null, 140], [178, null]]
    anchors:
      - measured: {swing_elbow_angle_at_impact: 171.0}
        grade: 2
        evidence: "타점에서 팔꿈치각 171도로 최고점에서 맞혔다"
      - measured: {swing_elbow_angle_at_impact: 148.0}
        grade: 1
        evidence: "팔꿈치각 148도로 타점이 낮아졌다"
      - measured: {swing_elbow_angle_at_impact: 126.0}
        grade: 0
        evidence: "팔꿈치각 126도로 팔이 접힌 채 맞혔다"

  - id: body_rotation
    name: 몸통 회전
    weight: 0.25
    rationale: >-
      옆으로 선 자세에서 골반이 돌아 나오며 힘이 만들어진다.
      회전 없이 팔로만 치면 속도가 나오지 않고 어깨에 부담이 간다.
    measured_by: [hip_rotation_range_deg]
    titles:
      2: "열리며 도는 골반"
      1: "덜 열린 골반"
      0: "잠긴 골반"
    grades:
      2: "준비~타점 구간 골반 회전 범위 35도 이상"
      1: "18~35도"
      0: "18도 미만"
    bands:
      metric: hip_rotation_range_deg
      2: [[35, null]]
      1: [[18, 35]]
      0: [[null, 18]]
    anchors:
      - measured: {hip_rotation_range_deg: 47.0}
        grade: 2
        evidence: "골반 회전 범위 47도로 몸통이 열리며 돌아 나왔다"
      - measured: {hip_rotation_range_deg: 24.0}
        grade: 1
        evidence: "회전 범위 24도로 회전이 부족하다"
      - measured: {hip_rotation_range_deg: 11.0}
        grade: 0
        evidence: "회전 범위 11도로 팔로만 쳤다"

  - id: leg_drive
    name: 하체 신전
    weight: 0.2
    rationale: >-
      무릎을 굽혔다 펴며 몸을 위로 밀어 올려야 타점이 올라간다.
      다리를 쓰지 않으면 팔만으로 치게 된다.
    measured_by: [swing_knee_angle_at_impact]
    titles:
      2: "밀어 올린 하체"
      1: "덜 쓴 하체"
      0: "쓰지 않은 하체"
    grades:
      2: "타점에서 무릎각 160도 이상"
      1: "140~160도"
      0: "140도 미만"
    bands:
      metric: swing_knee_angle_at_impact
      2: [[160, null]]
      1: [[140, 160]]
      0: [[null, 140]]
    anchors:
      - measured: {swing_knee_angle_at_impact: 173.0}
        grade: 2
        evidence: "타점에서 무릎각 173도로 하체를 끝까지 밀어 올렸다"
      - measured: {swing_knee_angle_at_impact: 151.0}
        grade: 1
        evidence: "무릎각 151도로 하체 신전이 덜 끝났다"
      - measured: {swing_knee_angle_at_impact: 133.0}
        grade: 0
        evidence: "무릎각 133도로 다리를 쓰지 않았다"

  - id: swing_follow_through
    name: 스윙 마무리
    weight: 0.25
    rationale: >-
      타점 후 라켓이 몸을 가로질러 반대쪽으로 내려와야 회전과 속도가 실린다.
      맞고 멈추면 공이 뜨고 팔꿈치에 부담이 간다.
    measured_by: [swing_shoulder_flexion_after_impact_deg]
    titles:
      2: "몸을 가로지른 마무리"
      1: "짧은 마무리"
      0: "멈춘 스윙"
    grades:
      2: "타점 후 어깨 굴곡이 30도 이상 추가 진행"
      1: "12~30도"
      0: "12도 미만"
    bands:
      metric: swing_shoulder_flexion_after_impact_deg
      2: [[30, null]]
      1: [[12, 30]]
      0: [[null, 12]]
    anchors:
      - measured: {swing_shoulder_flexion_after_impact_deg: 44.0}
        grade: 2
        evidence: "타점 후 어깨 굴곡 44도 추가 진행, 라켓이 몸을 가로질렀다"
      - measured: {swing_shoulder_flexion_after_impact_deg: 18.0}
        grade: 1
        evidence: "추가 굴곡 18도로 마무리가 짧다"
      - measured: {swing_shoulder_flexion_after_impact_deg: 6.0}
        grade: 0
        evidence: "추가 굴곡 6도로 타점 직후 스윙이 멈췄다"

deferred:
  - id: toss_position
    name: 토스 위치
    blocked_by: >-
      테니스공은 sports_ball로 검출되지만 크기가 작고 빨라 실측 데이터가 없다.
      토스 높이·전후 위치를 지표로 쓰려면 검출률부터 확인해야 한다.
  - id: racket_path
    name: 라켓 궤도
    blocked_by: >-
      라켓 검출이 실측에서 오검출만 나왔다 (pose.py MIN_TOOL_CONFIDENCE 주석).

grade_bands:
  A: 85
  B: 70
  C: 50
  D: 0
