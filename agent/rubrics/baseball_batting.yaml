# 야구 타격 채점 루브릭
#
# ⚠️ 임계값은 **지도자 검수 전 임시값**이다 (미결 항목 2번).
# ⚠️ **실클립 미검증** — `validated_on`이 비어 있다. 이 종목 영상에서 지표가
#    제대로 나오는지 아직 확인하지 않았다.
#
# 🔴 **타격은 두 손 스윙이다.** 이 한 줄이 이 파일의 설계를 거의 다 정한다.
#    투구·슛과 달리 "스윙 팔 대 지지 팔"이라는 구분이 동작에 없다 — 두 손이
#    같은 배트를 잡는다. 실제로 39클립 중 판독된 12건에서 사람이 매긴
#    `swing_arm`은 `both`가 4건(33%)이었다(미결 6번 `labeling/RESULTS.md`).
#
#    그래서 이 루브릭은 좌우를 **톱핸드(배트 위쪽 손) / 보텀핸드(아래쪽 손)** 로
#    읽는다. `top_hand`는 두 손 스윙에서도 **항상 정의되고** 타석(좌타/우타)과
#    1:1로 대응한다 — 12건 전부에 L/R이 매겨졌고 `both`가 없었다.
#
#      swing 측  = 톱핸드   (우타 → right, 좌타 → left)
#      support 측 = 보텀핸드 (그 반대쪽)
#
# 🔴 **`--side`를 반드시 준다.** 자동 판별(말단 이동량)은 이 동작에서 근거가
#    얇다 — 사람이 매긴 `top_hand`와 **5/12(42%)** 만 겹쳤다. 안 주면 조용히
#    반대 손을 톱핸드로 잡고, 그러면 아래 두 팔 항목이 서로 뒤바뀐다.
#    좌타/우타는 업로드하는 사람이 아는 값이다.
#
# 왜 다리 항목이 없나 — deferred의 `front_leg_block` 참고. 한 줄로는:
#   자동 다리 판별이 사람 라벨과 4/11(36.4%, 95% CI [15.2%, 64.6%])만 맞았다.
#   앞다리·뒷다리를 가려내지 못하는 상태에서 "앞무릎이 버텼는가"를 매기면
#   **절반쯤은 뒷다리를 채점한다.**
#
# 설계 원칙 (다른 루브릭과 같다)
#   - 등급은 bands(수치 구간)로 **코드가** 판정한다. 언어 모델은 근거 문장만
#     쓴다. 구간은 양끝을 포함하며 2 → 1 → 0 순으로 먼저 맞는 등급을 취한다.
#   - 측정되지 않은 지표를 쓰는 항목은 **0점이 아니라 제외**되고 남은 항목으로
#     가중치가 재정규화된다 — 촬영 조건으로 선수를 감점하지 않는다.
#   - 상위 등급 구간은 양끝을 닫는다. 위가 열린 2등급은 오측정을 만점으로
#     만든다(투구 실클립에서 골반 회전 181.1도가 장점으로 표시된 적이 있다).
#
# ────────────────────────────────────────────────────────────────────────────
# 🔴 임계값을 **실측에 맞춰 고치지 않았다** (2026-09-04). 아래가 그 실측이다.
#
# JHMDB 46클립의 지표 분포와 이 구간들이 낸 등급:
#
#   항목                     0/1/2      측정 중앙값   구간 2등급
#   lead_arm_extension       26/10/10     103.2도     140~175
#   hip_rotation             24/11/11      16.3도      30~120
#   hip_shoulder_separation  15/11/ 8      19.5도      25~ 60   (n=34)
#   follow_through           20/ 6/20      52.8도      25~120
#   trunk_posture             0/ 3/43       1.1도     -25~ 25
#
# **고치지 않은 이유**: 이 54클립에는 자세 등급 정답이 없다. 분포에 맞춰
# 구간을 옮기면 등급이 고르게 퍼지긴 하지만 **동작점을 옮긴 것이지 맞아진
# 것이 아니다** — target 30 전환에서 이미 겪은 착각이다. 구간은 지도자
# 검수(미결 2번)로 정하고, 그때 이 분포를 참고 자료로 함께 올린다.
#
# 그래도 **지금 읽어 둘 것 두 가지**:
#   (1) `trunk_posture`가 46건 중 43건을 2등급으로 준다 — 사실상 갈리지 않는다.
#       구간이 넓은 것이 아니라 이 지표의 실제 산포가 좁다(|기울기| 중앙 7.2도,
#       최대 30.3도). 검수 때 구간을 좁히든지 항목을 빼든지 결정해야 한다.
#   (2) 0등급 중 상당수가 **아래가 아니라 위**에서 왔다 —
#       `hip_shoulder_separation` 15건 중 8건, `follow_through` 20건 중 12건이
#       상한 초과다. 상한은 오측정을 막으려고 둔 것인데 그것이 **0등급(못했다)**
#       으로 나간다. 지금 구조에서는 밴드가 값 범위를 다 덮어야 해서 달리 둘
#       자리가 없다(`scoring.grade_for`). 이 결함은 `baseball_pitching`도
#       같이 갖고 있다 — 미결 항목에 올려 두었다.
# ────────────────────────────────────────────────────────────────────────────

sport: baseball
motion: batting
sport_ko: 야구
motion_ko: 타격
version: 0.1
# status: 사용자 선택지에 올릴지 여부 — active만 오른다.
#   **draft로 둔다.** 미결 3번의 결정이 "종목당 한 동작"이고 야구는
#   `baseball/pitching`이 이미 열려 있다. 여는 실제 비용은 이 YAML이 아니라
#   임계값 실측·지도자 검수·검증 클립이며, 아래 임계값은 그 셋이 다 비어 있다.
#   **닫혀 있어도 스크립트로는 돈다** — `analyze.py`/`analyze_keypoints.py`/
#   `analyze_s3.py`는 `--rubric` 경로로 직접 적재하고 status를 보지 않는다.
#   status를 보는 곳은 `GET /rubrics`(사용자 선택지)뿐이다.
status: draft
review_required: true
pipeline_version: pose-v0.1
validated_on: >-
  JHMDB `swing_baseball` 54클립, **영상 없이 관절 시계열만으로**
  (`scripts/analyze_keypoints.py`, 2026-09-04). 46/54 측정 통과 — 실패 8건은
  전부 같은 원인(임팩트가 마지막 프레임에 잡혀 경계 규칙에 걸림)이고 클립이
  15~40프레임으로 짧아서다. **파이프라인이 이 동작에서 지표를 낸다는 것까지만
  확인했다.** 🔴 정답은 관절이지 자세 등급이 아니므로 **점수의 타당성은
  검증되지 않았다.** 신뢰도 열이 없어 1.0으로 채운 경로라 품질 게이트도
  걸리지 않았다 — 영상 경로의 `features_ok`와 같은 뜻이 아니다.

kinematics:
  # 임팩트 = 톱핸드 팔꿈치의 신전 각속도가 최대인 프레임.
  #
  # distal_apex가 아닌 이유: 스윙은 들어올려 놓는 동작이 아니다. 손 최고점은
  # 타격 궤도에서 접촉과 무관한 지점(대개 테이크백 끝)이다.
  #
  # 🔴 **이것이 접촉 프레임이라는 확인은 아직 없다.** 투구 루브릭이 같은
  # 자리에서 어긋나 있다 — extension_peak이 릴리스가 아니라 신전 **중간**을
  # 잡았다(`baseball_pitching.yaml`의 validated_on). 타격도 같은 위험이 있고,
  # 접촉 프레임 정답이 생기기 전에는 "임팩트"를 **접촉이 아니라 신전 피크**로
  # 읽어야 한다. 아래 항목들이 톱핸드 팔꿈치각 자체를 채점하지 않는 이유이기도
  # 하다(deferred의 `top_hand_elbow_extension`).
  impact_limb: arm
  impact_event: extension_peak

criteria:
  - id: lead_arm_extension
    name: 리드 팔(보텀핸드) 신전
    weight: 0.25
    rationale: >-
      배트 아래쪽을 잡은 팔이 접촉 구간에서 펴져 나가야 스윙 궤도가 길어지고
      배트 헤드가 늦지 않는다. 팔꿈치가 몸에 붙어 접히면(이른바 닭날개) 궤도가
      짧아져 배트가 안쪽으로 감기고, 반대로 접촉 전에 이미 다 펴지면 가속
      구간을 지나친 뒤 공을 만난다.
      **임팩트를 정의하는 관절이 아니라서** 이 항목은 순환하지 않는다 —
      임팩트는 톱핸드 팔꿈치로 잡고, 여기서 재는 것은 반대쪽 팔이다.
    measured_by: [support_elbow_angle_at_impact]
    titles:
      2: "뻗어 나가는 리드 팔"
      1: "덜 펴진 리드 팔"
      0: "접힌 리드 팔"
    grades:
      2: "임팩트 시 보텀핸드 팔꿈치각 140~175도"
      1: "115~140도"
      0: "115도 미만(접혔다) 또는 175도 초과(과신전 — 측정 오류 의심)"
    bands:
      metric: support_elbow_angle_at_impact
      2: [[140, 175]]
      1: [[115, 140]]
      0: [[null, 115], [175, null]]
    anchors:
      - measured: {support_elbow_angle_at_impact: 158.0}
        grade: 2
        evidence: "임팩트 시 리드 팔 팔꿈치각 158도로 스윙 궤도가 뻗어 나갔다"
      - measured: {support_elbow_angle_at_impact: 126.0}
        grade: 1
        evidence: "팔꿈치각 126도로 리드 팔이 아직 덜 펴진 채 공을 만났다"
      - measured: {support_elbow_angle_at_impact: 98.0}
        grade: 0
        evidence: "팔꿈치각 98도로 리드 팔이 접혀 궤도가 짧아졌다"

  - id: hip_shoulder_separation
    name: 골반-어깨 분리
    weight: 0.25
    rationale: >-
      앞발이 닿은 뒤 골반이 먼저 열리고 상체가 뒤따라야 힘이 순서대로 전달된다.
      두 축이 함께 돌면(분리 0에 가까움) 팔로만 휘두르는 스윙이 되어 배트 속도가
      나오지 않는다. 회전량(다음 항목)과 다른 값이다 — 이쪽은 **순서**이고
      저쪽은 **총량**이다.
    measured_by: [hip_shoulder_separation_deg]
    titles:
      2: "먼저 열리는 골반"
      1: "덜 열린 골반"
      0: "함께 도는 몸통"
    grades:
      2: "준비~임팩트 구간 최대 분리각 25~60도"
      1: "12~25도"
      0: "12도 미만(함께 돌았다) 또는 60도 초과(측정 오류 의심)"
    bands:
      metric: hip_shoulder_separation_deg
      2: [[25, 60]]
      1: [[12, 25]]
      0: [[null, 12], [60, null]]
    anchors:
      - measured: {hip_shoulder_separation_deg: 38.0}
        grade: 2
        evidence: "최대 분리각 38도로 골반이 상체보다 먼저 열렸다"
      - measured: {hip_shoulder_separation_deg: 18.0}
        grade: 1
        evidence: "분리각 18도로 골반이 먼저 열리는 정도가 부족하다"
      - measured: {hip_shoulder_separation_deg: 7.0}
        grade: 0
        evidence: "분리각 7도로 골반과 상체가 거의 함께 돌았다"

  - id: hip_rotation
    name: 골반 회전
    weight: 0.20
    rationale: >-
      타격의 힘은 하체 회전에서 온다. 준비 자세에서 임팩트까지 골반이 돌지
      않으면 상체와 팔만 쓰는 스윙이 된다.
      상한 120도를 둔 것은 좌우 키포인트 라벨이 뒤바뀔 때 회전량이 부풀기
      때문이다 — 축 기준(mod 180)으로 접어 그 원인은 없앴지만, 남은 오측정이
      "많이 돌았다"로 새어 나가지 않게 위를 닫아 둔다.
    measured_by: [hip_rotation_range_deg]
    titles:
      2: "돌아 나오는 하체"
      1: "절반만 돈 골반"
      0: "잠긴 골반"
    grades:
      2: "준비~임팩트 구간 골반 회전 범위 30~120도"
      1: "18~30도"
      0: "18도 미만(회전 없음) 또는 120도 초과(측정 오류 의심)"
    bands:
      metric: hip_rotation_range_deg
      2: [[30, 120]]
      1: [[18, 30]]
      0: [[null, 18], [120, null]]
    anchors:
      - measured: {hip_rotation_range_deg: 47.0}
        grade: 2
        evidence: "골반 회전 범위 47도로 하체가 돌아 나오며 힘을 실었다"
      - measured: {hip_rotation_range_deg: 22.0}
        grade: 1
        evidence: "회전 범위 22도로 골반이 절반만 열렸다"
      - measured: {hip_rotation_range_deg: 11.0}
        grade: 0
        evidence: "회전 범위 11도로 하체 회전이 거의 없는 상체 스윙이다"

  - id: trunk_posture
    name: 상체 유지
    weight: 0.15
    rationale: >-
      임팩트에서 상체가 무너지면 눈높이가 흔들리고 배트 궤도가 따라 흔들린다.
      앞으로 쏠리거나(덤빔) 뒤로 젖혀지는(뒤로 빠짐) 양쪽 다 결함이다.
      🔴 **구간이 0을 가운데 두고 좌우 대칭인 것은 의도다.** 이 지표는
      골반중심→어깨중심 벡터가 **화면 +x 쪽으로** 기운 각도라 부호가 타자가
      화면 어느 쪽을 보고 서느냐에 달려 있다. 축구 슈팅·농구 슛은 진행 방향이
      한쪽으로 정해져 부호를 그대로 썼지만, 타격은 좌타/우타와 카메라 위치에
      따라 같은 자세가 +와 -로 갈린다. 그래서 **기울기의 크기만** 본다.
    measured_by: [trunk_forward_lean_deg_at_impact]
    titles:
      2: "버티는 상체"
      1: "흔들린 상체"
      0: "무너진 상체"
    grades:
      2: "임팩트 시 상체 기울기 크기 25도 이내"
      1: "25~42도"
      0: "42도 초과(앞으로 덤비거나 뒤로 빠졌다)"
    bands:
      metric: trunk_forward_lean_deg_at_impact
      2: [[-25, 25]]
      1: [[-42, -25], [25, 42]]
      0: [[null, -42], [42, null]]
    anchors:
      - measured: {trunk_forward_lean_deg_at_impact: 11.0}
        grade: 2
        evidence: "상체 기울기 11도로 임팩트에서 자세가 버텼다"
      - measured: {trunk_forward_lean_deg_at_impact: -31.0}
        grade: 1
        evidence: "기울기 크기 31도로 상체가 한쪽으로 흔들렸다"
      - measured: {trunk_forward_lean_deg_at_impact: 53.0}
        grade: 0
        evidence: "기울기 크기 53도로 상체가 앞으로 무너졌다"

  - id: follow_through
    name: 팔로스루
    weight: 0.15
    rationale: >-
      접촉 뒤에도 팔이 몸을 감아 돌아야 감속 없이 배트 속도가 유지된다.
      임팩트 직후 멈추면 공에 힘이 덜 실리고 어깨·팔꿈치에 부담이 남는다.
      상한 120도는 신뢰도 낮은 프레임이 섞일 때 나오는 가짜 굴곡을 막는다 —
      실클립에서 109.2도짜리 가짜 값이 나온 적이 있다.
    measured_by: [swing_shoulder_flexion_after_impact_deg]
    titles:
      2: "감아 도는 팔"
      1: "짧아진 마무리"
      0: "멈춰 선 스윙"
    grades:
      2: "임팩트 후 톱핸드 어깨 굴곡이 25~120도 추가 진행"
      1: "10~25도"
      0: "10도 미만(임팩트 직후 정지) 또는 120도 초과(측정 오류 의심)"
    bands:
      metric: swing_shoulder_flexion_after_impact_deg
      2: [[25, 120]]
      1: [[10, 25]]
      0: [[null, 10], [120, null]]
    anchors:
      - measured: {swing_shoulder_flexion_after_impact_deg: 44.0}
        grade: 2
        evidence: "임팩트 후 어깨 굴곡 44도 추가 진행, 팔이 몸을 감아 돌았다"
      - measured: {swing_shoulder_flexion_after_impact_deg: 15.0}
        grade: 1
        evidence: "추가 굴곡 15도로 마무리 구간이 짧다"
      - measured: {swing_shoulder_flexion_after_impact_deg: 4.0}
        grade: 0
        evidence: "추가 굴곡 4도로 임팩트 직후 스윙이 멈췄다"

deferred:
  - id: top_hand_elbow_extension
    name: 톱핸드 팔꿈치 신전
    blocked_by: >-
      **임팩트 정의와 순환한다.** 임팩트를 톱핸드 팔꿈치의 신전 각속도 피크로
      잡으므로, 그 프레임의 팔꿈치각은 선수의 기량이 아니라 정의의 부산물이다
      (신전 구간 한가운데 값이 나온다). 투구 루브릭이 이 자리에서 어긋나 있고
      (릴리스 150~172도를 전제했는데 실제로는 61~102도가 잡혔다),
      `features.py`가 `swing_acceleration_timing`을 산출하지 않는 것도 같은
      이유다. 접촉 프레임 정답이 생겨 임팩트를 접촉으로 다시 정의하면 그때
      항목이 성립한다 (미결 5번).
  - id: front_leg_block
    name: 앞다리 버팀
    blocked_by: >-
      **어느 쪽이 앞다리인지 못 가른다.** `identify_limb`은 말단 이동량으로
      좌우를 고르는데, 이 평가셋에서 사람 라벨과 4/11(36.4%, 95% CI
      [15.2%, 64.6%])만 맞았다. 게다가 라벨이 L 9 · R 2로 치우쳐 "항상 L"이라는
      규칙만으로 9/11이 나온다 — 자동 판별이 그 기준선을 넘는다는 근거가 없다.
      `plant_knee_angle_at_impact`/`swing_knee_angle_at_impact`는 값 자체는
      나오지만 **어느 다리의 값인지가 불확실**해서 채점 근거로 쓰지 않는다.
      좌우를 사람이 지정할 수 있게 되면(팔과 다리를 따로 받는 인자) 열린다
      — 지금 `--side`는 `impact_limb`(=팔) 한쪽에만 적용된다. 미결 6번.
  - id: weight_shift
    name: 체중 이동
    blocked_by: >-
      골반 중심을 원점으로 정규화하므로 **몸 전체의 전후 이동이 좌표에서
      사라진다**(`features.normalize`). 스트라이드 거리·중심 이동을 재려면
      정규화 이전 좌표나 발 접지 기준이 필요한데, 지금 지표 산출 경로에 없다.
  - id: bat_path
    name: 배트 궤도
    blocked_by: >-
      배트 키포인트가 없다. COCO-17은 손목까지이고, 도구 검출기는
      `sports_ball`만 낸다. 공만으로는 접촉 지점을 못 잡는다 — 축구의
      `plant_foot_to_ball_offset`은 정지한 공을 전제한 기하라 타격에 그대로
      쓸 수 없다.
  - id: contact_timing
    name: 접촉 타이밍
    blocked_by: >-
      투구와의 상대 시각이 필요한데 클립 1건 단위 분석에는 상대가 없다.
      투구 루브릭의 `release_point_consistency`와 같은 종류의 제약이다.

grade_bands:
  A: 85
  B: 70
  C: 50
  D: 0
