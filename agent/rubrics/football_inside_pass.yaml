# 축구 인사이드 패스 채점 루브릭
#
# ⚠️ 임계값·가중치·칭호·카드 문구 모두 **검수되지 않은 값**이다.
#    인스텝 슈팅 루브릭의 기준을 패스 동작 지침에 맞춰 옮겨 잡은 초안이며,
#    실클립으로 검증되지 않았다.
#
# 🔴 2026.09.17 — **지도자 검수 없이 가기로 했다** (미결 2번 「검수 없이 갑니다」).
#    「골든셋 라벨링 시 확정한다」는 **확정하지 않는다**로 바뀐다. 인스텝 파일
#    머리말에 같은 정정을 적어 두었고, 근거·안전장치도 그쪽에 있다.
#    🔴 이 루브릭은 인스텝보다 **한 칸 더 얕다** — 34번 문헌 조사에서
#    인사이드 패스 5/5 는 **출처를 하나도 못 찾았다**.
#
# 이 파일은 **코드 변경 없이** 추가됐다. 인스텝 슈팅과 같은 다리 로직을 쓰므로
# features.py가 산출하는 지표를 그대로 골라 쓴다 — 루브릭이 데이터라는 증거다.
#
# 슈팅과 무엇이 다른가
#   - 무릎을 끝까지 펴지 않는다. 짧은 스윙으로 정확도를 낸다 → 신전 구간이 낮다
#   - 상체를 더 세운다. 공을 눌러 띄우지 않는 것이 목적이 아니라 방향이 목적이다
#   - 팔로스루가 짧다. 슈팅처럼 뻗어 나가면 공이 뜬다
#   - 디딤발을 공에 더 가까이 붙인다. 방향 정확도가 디딤발 조준에 달려 있다
#
# titles(칭호)·card_lines(추천 카드 불릿)를 쓰는 규칙은 인스텝 슈팅 루브릭
# 머리말에 한 번만 적어 두었다 — 여기 옮겨 적으면 한쪽만 고쳐진다. 요약하면
# **등급마다 고정된 문장**이고, **숫자와 경기 기록을 적지 않는다.**

sport: football
motion: inside_pass
sport_ko: 축구
motion_ko: 인사이드 패스
version: 0.1
# status: 사용자 선택지에 올릴지 여부 — active만 오른다.
#   draft는 파일은 갖추었으나 아직 열지 않은 동작이다. 임계값 검수 여부는
#   review_required가 따로 들고 있다 (두 축은 다르다: 열려 있어도 검수 전일 수
#   있고, 검수가 끝나도 범위 밖이라 닫아 둘 수 있다).
status: draft
review_required: true
pipeline_version: pose-v0.1
validated_on: ""

kinematics:
  impact_limb: leg
  impact_event: extension_peak

criteria:
  - id: plant_foot_position
    name: 디딤발 위치
    weight: 0.25
    rationale: >-
      인사이드 패스는 디딤발이 목표 방향을 겨눈다. 슈팅보다 공에 바짝 붙여
      딛어야 발 안쪽 면이 공 중심을 정확히 민다.
    measured_by: [plant_foot_to_ball_offset]
    titles:
      2: "방향을 잡은 디딤발"
      1: "빗나간 디딤발"
      0: "멀리 놓인 디딤발"
    card_lines:
      2: "디딤발로 방향을 잡습니다"
      1: "디딤발 조준이 빗나갑니다"
      0: "디딤발을 공에서 멀리 둡니다"
    bands:
      metric: plant_foot_to_ball_offset
      2: [[0, 0.4]]
      1: [[0.4, 0.75]]
      0: [[0.75, null]]
    # 🔴 `grades` 를 **숫자 없이** 다시 쓴 것 — 판정 모델이 읽는 것은
    #    이쪽이다 (미결 23번 가-2). 숫자가 있으면 모델이 베끼고,
    #    양방향을 한 문장에 담으면 방향을 찍는다. 구간마다 쓴 자리는
    #    **bands 순서와 자리가 맞아야 한다**(적재가 검사한다).
    grades_plain:
      2: "디딤발을 공 옆에 바짝 붙여 딛는다"
      1: "디딤발이 공에서 조금 멀어진다"
      0: "디딤발이 공에서 멀리 떨어져 딛는다"
    grades:
      2: "임팩트 시 디딤발과 공의 수평 간격이 어깨너비 0.4배 이내(약 16cm)"
      1: "0.4~0.75배(약 16~30cm)"
      0: "0.75배 초과(약 30cm 초과)"
    anchors:
      - measured: {plant_foot_to_ball_offset: 0.22}
        grade: 2
        evidence: "디딤발이 공 옆 어깨너비 0.22배에 붙어 방향이 고정됐다"
      - measured: {plant_foot_to_ball_offset: 0.58}
        grade: 1
        evidence: "간격 0.58배로 조준이 다소 헐겁다"
      - measured: {plant_foot_to_ball_offset: 0.95}
        grade: 0
        evidence: "간격 0.95배로 디딤발이 공에서 떨어져 방향이 흔들린다"

  - id: swing_knee_extension
    name: 차는 다리 뻗기
    weight: 0.20
    rationale: >-
      패스는 짧은 스윙으로 민다. 슈팅처럼 무릎을 끝까지 펴면 공이 뜨고
      세기 조절이 안 된다.
    measured_by: [swing_knee_angle_at_impact]
    titles:
      2: "짧고 정확한 스윙"
      1: "과한 스윙"
      0:
        - "덜 뻗은 다리"      # 120도 미만
        - "슈팅이 된 스윙"    # 170도 초과
    card_lines:
      2: "짧고 정확하게 밀어 찹니다"
      1: "패스치고 스윙이 큽니다"
      0:
        - "무릎이 덜 펴져 공을 밀지 못합니다"   # 120도 미만
        - "패스인데 무릎을 슈팅처럼 끝까지 폅니다"  # 170도 초과
    bands:
      metric: swing_knee_angle_at_impact
      2: [[120, 155]]
      1: [[155, 170]]
      0: [[null, 120], [170, null]]
    # 🔴 `grades` 를 **숫자 없이** 다시 쓴 것 — 판정 모델이 읽는 것은
    #    이쪽이다 (미결 23번 가-2). 숫자가 있으면 모델이 베끼고,
    #    양방향을 한 문장에 담으면 방향을 찍는다. 구간마다 쓴 자리는
    #    **bands 순서와 자리가 맞아야 한다**(적재가 검사한다).
    grades_plain:
      2: "무릎을 짧게 접은 채로 공을 밀어 찬다"
      1: "무릎이 필요보다 많이 펴진다"
      0:
        - "무릎이 너무 접혀 공을 밀어내지 못한다"
        - "패스인데 무릎을 슈팅처럼 끝까지 편다"
    grades:
      2: "임팩트 시 무릎각 120~155도 (짧게 접힌 스윙)"
      1: "155~170도"
      0: "170도 초과(완전 신전, 슈팅 동작) 또는 120도 미만"
    anchors:
      - measured: {swing_knee_angle_at_impact: 138.0}
        grade: 2
        evidence: "무릎각 138도로 스윙이 짧게 절제됐다"
      - measured: {swing_knee_angle_at_impact: 162.0}
        grade: 1
        evidence: "무릎각 162도로 스윙이 다소 커졌다"
      - measured: {swing_knee_angle_at_impact: 176.0}
        grade: 0
        evidence: "무릎각 176도로 완전히 펴져 패스가 아니라 슈팅 궤적이 된다"
      - measured: {swing_knee_angle_at_impact: 95.0}
        grade: 0
        evidence: "무릎각 95도로 무릎이 너무 접혀 공을 밀어내지 못했다"

  - id: trunk_lean
    name: 상체 기울기
    weight: 0.20
    rationale: >-
      패스는 공을 누르는 것이 아니라 방향을 주는 동작이다. 상체를 세워
      시야를 확보하되, 뒤로 젖혀지면 공이 뜬다.
    measured_by: [trunk_forward_lean_deg_at_impact]
    titles:
      2: "곧게 선 상체"
      1: "숙인 상체"
      0:
        - "젖혀진 상체"       # 2도 미만
        - "깊이 숙인 상체"    # 25도 초과
    card_lines:
      2: "상체를 곧게 세웁니다"
      1: "상체가 앞으로 숙여집니다"
      0:
        - "상체가 뒤로 젖혀집니다"        # 2도 미만
        - "상체를 공 위로 깊이 숙입니다"   # 25도 초과
    bands:
      metric: trunk_forward_lean_deg_at_impact
      2: [[2, 15]]
      1: [[15, 25]]
      0: [[null, 2], [25, null]]
    # 🔴 `grades` 를 **숫자 없이** 다시 쓴 것 — 판정 모델이 읽는 것은
    #    이쪽이다 (미결 23번 가-2). 숫자가 있으면 모델이 베끼고,
    #    양방향을 한 문장에 담으면 방향을 찍는다. 구간마다 쓴 자리는
    #    **bands 순서와 자리가 맞아야 한다**(적재가 검사한다).
    grades_plain:
      2: "상체를 곧게 세운 채로 찬다"
      1: "상체를 공 위로 숙인다"
      0:
        - "상체가 뒤로 젖혀진다"
        - "상체를 공 위로 깊이 숙인다"
    grades:
      2: "임팩트 시 상체 전방 기울기 2~15도"
      1: "15~25도(과도한 전방)"
      0: "2도 미만(후방 젖힘) 또는 25도 초과"
    anchors:
      - measured: {trunk_forward_lean_deg_at_impact: 8.0}
        grade: 2
        evidence: "상체 기울기 8도로 시야를 유지하면서 공 위에 섰다"
      - measured: {trunk_forward_lean_deg_at_impact: 20.0}
        grade: 1
        evidence: "기울기 20도로 상체가 과하게 숙여졌다"
      - measured: {trunk_forward_lean_deg_at_impact: -3.0}
        grade: 0
        evidence: "기울기 -3도로 상체가 젖혀져 패스가 뜬다"
      - measured: {trunk_forward_lean_deg_at_impact: 30.0}
        grade: 0
        evidence: "기울기 30도로 상체를 공 위로 깊이 숙였다"

  - id: hip_rotation
    name: 골반 돌리기
    weight: 0.15
    rationale: >-
      인사이드 면을 공에 대려면 골반이 열려야 한다. 다만 슈팅만큼 크게 돌면
      방향 제어를 잃는다.
    measured_by: [hip_rotation_range_deg]
    titles:
      2: "알맞게 열린 골반"
      1:
        - "덜 열린 골반"          # 8~15도
        - "지나치게 돌린 골반"    # 35도 초과
      0: "닫힌 골반"
    card_lines:
      2: "골반을 알맞게 열어 줍니다"
      # 🔴 이 등급은 **반대 방향 둘**이라 문장도 둘이다. 자리는 위 bands 의 구간
      #    순서를 따른다 — 어긋나면 덜 돈 선수에게 「지나치게 돌린다」고 말한다.
      1:
        - "골반을 덜 열고 찹니다"          # 8~15도
        - "골반을 지나치게 많이 돌립니다"   # 35도 초과
      0: "골반이 거의 열리지 않습니다"
    bands:
      metric: hip_rotation_range_deg
      2: [[15, 35]]
      1: [[8, 15], [35, 180]]
      0: [[null, 8]]
    # 🔴 `grades` 를 **숫자 없이** 다시 쓴 것 — 판정 모델이 읽는 것은
    #    이쪽이다 (미결 23번 가-2). 숫자가 있으면 모델이 베끼고,
    #    양방향을 한 문장에 담으면 방향을 찍는다. 구간마다 쓴 자리는
    #    **bands 순서와 자리가 맞아야 한다**(적재가 검사한다).
    grades_plain:
      2: "인사이드 면이 공을 향하도록 골반을 알맞게 연다"
      1:
        - "골반을 덜 열고 찬다"
        - "골반을 지나치게 많이 돌린다"
      0: "골반이 닫힌 채로 차서 인사이드 면이 공에 닿지 않는다"
    grades:
      2: "백스윙~임팩트 구간 골반 회전 15~35도"
      1: "8~15도 또는 35도 초과(과회전)"
      0: "8도 미만"
    anchors:
      - measured: {hip_rotation_range_deg: 24.0}
        grade: 2
        evidence: "골반 회전 24도로 인사이드 면이 공을 향해 열렸다"
      - measured: {hip_rotation_range_deg: 11.0}
        grade: 1
        evidence: "회전 11도로 골반이 덜 열려 면이 비뚤어진다"
      - measured: {hip_rotation_range_deg: 5.0}
        grade: 0
        evidence: "회전 5도로 골반이 닫혀 발끝으로 밀게 된다"
      - measured: {hip_rotation_range_deg: 45.0}
        grade: 1
        evidence: "회전 45도로 골반을 지나치게 많이 돌렸다"

  - id: follow_through
    name: 차고 난 뒤 마무리
    weight: 0.20
    rationale: >-
      패스의 팔로스루는 짧고 방향을 향한다. 슈팅처럼 크게 뻗으면 세기가
      과해지고 공이 뜬다.
    measured_by: [swing_hip_flexion_after_impact_deg, follow_through_duration_frames]
    titles:
      2: "방향을 남긴 마무리"
      1:
        - "짧아진 마무리"    # 3~8도
        - "과한 마무리"      # 25도 초과
      0: "끊긴 마무리"
    card_lines:
      2: "마무리로 방향을 남깁니다"
      1:
        - "찬 뒤 다리가 금방 멈춥니다"          # 3~8도
        - "패스인데 마무리가 슈팅처럼 큽니다"    # 25도 초과
      0: "찬 뒤 마무리가 끊깁니다"
    bands:
      metric: swing_hip_flexion_after_impact_deg
      2: [[8, 25]]
      1: [[3, 8], [25, 180]]
      0: [[null, 3]]
    # 🔴 `grades` 를 **숫자 없이** 다시 쓴 것 — 판정 모델이 읽는 것은
    #    이쪽이다 (미결 23번 가-2). 숫자가 있으면 모델이 베끼고,
    #    양방향을 한 문장에 담으면 방향을 찍는다. 구간마다 쓴 자리는
    #    **bands 순서와 자리가 맞아야 한다**(적재가 검사한다).
    grades_plain:
      2: "찬 뒤 다리가 짧게, 방향을 남기며 멈춘다"
      1:
        - "찬 뒤 다리가 조금밖에 안 나간다"
        - "패스인데 마무리가 슈팅처럼 크다"
      0: "찬 직후에 다리가 그대로 멈춘다"
    grades:
      2: "임팩트 후 고관절 굴곡 8~25도 추가 진행 (짧고 방향성 있는 마무리)"
      1: "3~8도 또는 25도 초과(슈팅에 가까운 과한 마무리)"
      0: "3도 미만 (임팩트 직후 정지)"
    anchors:
      - measured: {swing_hip_flexion_after_impact_deg: 15.0, follow_through_duration_frames: 4}
        grade: 2
        evidence: "임팩트 후 15도 추가 진행으로 방향을 남기고 멈췄다"
      - measured: {swing_hip_flexion_after_impact_deg: 32.0, follow_through_duration_frames: 8}
        grade: 1
        evidence: "32도까지 뻗어 패스보다 슈팅에 가까운 마무리다"
      - measured: {swing_hip_flexion_after_impact_deg: 1.5, follow_through_duration_frames: 1}
        grade: 0
        evidence: "추가 굴곡 1.5도로 임팩트 직후 스윙이 끊겼다"
      - measured: {swing_hip_flexion_after_impact_deg: 5.0,
                   follow_through_duration_frames: 2}
        grade: 1
        evidence: "굴곡 5도로 찬 뒤 다리가 조금밖에 안 나갔다"

# 아직 측정할 수 없는 항목.
deferred:
  - id: ankle_lock
    name: 발목 고정
    blocked_by: >-
      COCO-17은 발목까지만 있고 발끝·발날이 없다. 인사이드 패스의 핵심인
      "발목을 잠그고 발 안쪽 면을 세우는" 동작은 관절 하나로 판별할 수 없다.
      발 키포인트를 내는 모델(예: COCO-WholeBody)이 필요하다.
  - id: pass_direction_accuracy
    name: 패스 방향 정확도
    blocked_by: >-
      공의 출발 방향은 궤적으로 잴 수 있으나, 의도한 목표 지점을 알 수 없다.
      목표(동료 위치)를 입력받거나 검출해야 정확도를 정의할 수 있다.

# 총점 등급 구간 (가중합 0.0~1.0 → 100점 환산)
grade_bands:
  A: 85
  B: 70
  C: 50
  D: 0
