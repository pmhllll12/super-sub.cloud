# 배드민턴 하이클리어 채점 루브릭
#
# ⚠️ 임계값은 **지도자 검수 전 임시값**이다 (미결 항목 2번).
# ⚠️ **실클립 미검증** — 파이프라인이 이 종목 영상에서 지표를 제대로 뽑는지
#    아직 확인하지 않았다.
#
# 셔틀콕은 COCO 80클래스에 없어 검출되지 않는다. 라켓도 실측에서 오검출만
# 나왔다(pose.py MIN_TOOL_CONFIDENCE 주석 참고). 따라서 도구 기반 항목은 전부
# deferred에 두고, 몸의 자세만으로 채점한다.

sport: badminton
motion: overhead_clear
sport_ko: 배드민턴
motion_ko: 하이클리어
version: 0.1
status: draft
review_required: true
pipeline_version: pose-v0.1
validated_on: ""

kinematics:
  impact_limb: arm
  impact_event: extension_peak

criteria:
  - id: contact_arm_extension
    name: 타점 팔 신전
    weight: 0.3
    rationale: >-
      머리 위에서 팔이 펴진 상태로 맞아야 타점이 높고 비거리가 나온다.
      팔이 접힌 채 맞으면 타점이 내려와 상대에게 시간을 준다.
    measured_by: [swing_elbow_angle_at_impact]
    titles:
      2: "머리 위 높은 타점"
      1: "내려온 타점"
      0: "접힌 팔"
    grades:
      2: "타점에서 팔꿈치각 155~178도"
      1: "130~155도"
      0: "130도 미만"
    bands:
      metric: swing_elbow_angle_at_impact
      2: [[155, 178]]
      1: [[130, 155]]
      0: [[null, 130], [178, null]]
    anchors:
      - measured: {swing_elbow_angle_at_impact: 166.0}
        grade: 2
        evidence: "타점에서 팔꿈치각 166도로 머리 위에서 뻗어 맞혔다"
      - measured: {swing_elbow_angle_at_impact: 141.0}
        grade: 1
        evidence: "팔꿈치각 141도로 타점이 내려왔다"
      - measured: {swing_elbow_angle_at_impact: 112.0}
        grade: 0
        evidence: "팔꿈치각 112도로 팔이 접힌 채 맞혔다"

  - id: body_rotation
    name: 몸통 회전
    weight: 0.25
    rationale: >-
      골반이 옆을 향했다가 타점에서 정면으로 돌아오며 힘이 만들어진다.
      회전 없이 팔로만 치면 손목에 부담이 가고 비거리가 나오지 않는다.
    measured_by: [hip_rotation_range_deg]
    titles:
      2: "돌아 나오는 몸통"
      1: "덜 돌린 몸통"
      0: "팔로만 친 스윙"
    grades:
      2: "백스윙~타점 구간 골반 회전 범위 30도 이상"
      1: "15~30도"
      0: "15도 미만"
    bands:
      metric: hip_rotation_range_deg
      2: [[30, null]]
      1: [[15, 30]]
      0: [[null, 15]]
    anchors:
      - measured: {hip_rotation_range_deg: 42.0}
        grade: 2
        evidence: "골반 회전 범위 42도로 몸통이 돌아 나왔다"
      - measured: {hip_rotation_range_deg: 21.0}
        grade: 1
        evidence: "회전 범위 21도로 몸통 회전이 부족하다"
      - measured: {hip_rotation_range_deg: 8.0}
        grade: 0
        evidence: "회전 범위 8도로 팔로만 쳤다"

  - id: swing_follow_through
    name: 스윙 마무리
    weight: 0.25
    rationale: >-
      타점 후 팔이 몸 앞으로 계속 내려와야 셔틀에 힘이 다 전달된다.
      맞자마자 멈추면 비거리가 짧아진다.
    measured_by: [swing_shoulder_flexion_after_impact_deg]
    titles:
      2: "끝까지 따라간 라켓"
      1: "짧은 마무리"
      0: "멈춘 스윙"
    grades:
      2: "타점 후 어깨 굴곡이 25도 이상 추가 진행"
      1: "10~25도"
      0: "10도 미만"
    bands:
      metric: swing_shoulder_flexion_after_impact_deg
      2: [[25, null]]
      1: [[10, 25]]
      0: [[null, 10]]
    anchors:
      - measured: {swing_shoulder_flexion_after_impact_deg: 34.0}
        grade: 2
        evidence: "타점 후 어깨 굴곡 34도 추가 진행"
      - measured: {swing_shoulder_flexion_after_impact_deg: 14.0}
        grade: 1
        evidence: "추가 굴곡 14도로 마무리가 짧다"
      - measured: {swing_shoulder_flexion_after_impact_deg: 5.0}
        grade: 0
        evidence: "추가 굴곡 5도로 타점 직후 스윙이 멈췄다"

  - id: trunk_posture
    name: 상체 자세
    weight: 0.2
    rationale: >-
      뒤쪽 코트에서 치므로 상체가 뒤로 젖혀지기 쉽다. 크게 젖혀지면 체중이
      뒤에 남아 다음 동작으로 이어지지 않는다.
    measured_by: [trunk_forward_lean_deg_at_impact]
    titles:
      2: "체중이 앞에 선 상체"
      1: "뒤에 남은 체중"
      0: "넘어가는 상체"
    grades:
      2: "타점에서 상체 전방 기울기 -10~15도"
      1: "-25~-10도 또는 15~30도"
      0: "-25도 미만 또는 30도 초과"
    bands:
      metric: trunk_forward_lean_deg_at_impact
      2: [[-10, 15]]
      1: [[-25, -10], [15, 30]]
      0: [[null, -25], [30, null]]
    anchors:
      - measured: {trunk_forward_lean_deg_at_impact: 6.0}
        grade: 2
        evidence: "상체 기울기 6도로 체중이 앞에 남았다"
      - measured: {trunk_forward_lean_deg_at_impact: -17.0}
        grade: 1
        evidence: "기울기 -17도로 체중이 뒤에 남았다"
      - measured: {trunk_forward_lean_deg_at_impact: -31.0}
        grade: 0
        evidence: "기울기 -31도로 상체가 크게 젖혀졌다"

deferred:
  - id: contact_height
    name: 타점 높이 (셔틀 대비)
    blocked_by: >-
      셔틀콕이 COCO 80클래스에 없어 검출되지 않는다. 별도 학습이 필요하다.
  - id: racket_face
    name: 라켓 면
    blocked_by: >-
      라켓 검출이 실측에서 오검출만 나왔다 (중앙값 신뢰도 0.45, 0.8 이상 0프레임).
      면의 방향은 검출 박스로는 표현되지 않는다.

grade_bands:
  A: 85
  B: 70
  C: 50
  D: 0
