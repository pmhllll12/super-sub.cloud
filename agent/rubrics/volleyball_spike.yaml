# 배구 스파이크 채점 루브릭
#
# ⚠️ 임계값은 **지도자 검수 전 임시값**이다 (미결 항목 2번).
# ⚠️ **실클립 미검증** — 파이프라인이 이 종목 영상에서 지표를 제대로 뽑는지
#    아직 확인하지 않았다.

sport: volleyball
motion: spike
sport_ko: 배구
motion_ko: 스파이크
version: 0.1
status: draft
review_required: true
pipeline_version: pose-v0.1
validated_on: ""

kinematics:
  impact_limb: arm
  impact_event: extension_peak

criteria:
  - id: hitting_arm_extension
    name: 때리는 팔 신전
    weight: 0.3
    rationale: >-
      타점에서 팔이 충분히 펴져야 타점이 높아지고 각도가 선다.
      팔이 접힌 채 때리면 네트를 넘기기 위해 공을 밀게 된다.
    measured_by: [swing_elbow_angle_at_impact]
    titles:
      2: "가장 높은 타점"
      1: "낮아진 타점"
      0: "밀어 넘긴 팔"
    grades:
      2: "타점에서 팔꿈치각 155~178도"
      1: "135~155도"
      0: "135도 미만"
    bands:
      metric: swing_elbow_angle_at_impact
      2: [[155, 178]]
      1: [[135, 155]]
      0: [[null, 135], [178, null]]
    anchors:
      - measured: {swing_elbow_angle_at_impact: 168.0}
        grade: 2
        evidence: "타점에서 팔꿈치각 168도로 팔을 뻗어 때렸다"
      - measured: {swing_elbow_angle_at_impact: 143.0}
        grade: 1
        evidence: "팔꿈치각 143도로 타점이 낮아졌다"
      - measured: {swing_elbow_angle_at_impact: 118.0}
        grade: 0
        evidence: "팔꿈치각 118도로 팔이 접힌 채 공을 밀었다"

  - id: trunk_arch
    name: 상체 활 모양
    weight: 0.25
    rationale: >-
      백스윙에서 상체를 젖혔다가 타점에서 앞으로 넘기며 힘을 만든다.
      타점에서도 뒤로 젖혀져 있으면 공이 뜬다.
    measured_by: [trunk_forward_lean_deg_at_impact]
    titles:
      2: "넘어가는 상체"
      1: "덜 넘어간 상체"
      0: "젖혀진 상체"
    grades:
      2: "타점에서 상체 전방 기울기 5~25도"
      1: "-5~5도 또는 25~40도"
      0: "-5도 미만(후방 젖힘) 또는 40도 초과"
    bands:
      metric: trunk_forward_lean_deg_at_impact
      2: [[5, 25]]
      1: [[-5, 5], [25, 40]]
      0: [[null, -5], [40, null]]
    anchors:
      - measured: {trunk_forward_lean_deg_at_impact: 15.0}
        grade: 2
        evidence: "상체 기울기 15도로 타점에서 앞으로 넘어갔다"
      - measured: {trunk_forward_lean_deg_at_impact: 1.0}
        grade: 1
        evidence: "기울기 1도로 상체가 아직 넘어가지 않았다"
      - measured: {trunk_forward_lean_deg_at_impact: -12.0}
        grade: 0
        evidence: "기울기 -12도로 젖혀진 채 때려 공이 뜬다"

  - id: arm_swing_through
    name: 스윙 마무리
    weight: 0.25
    rationale: >-
      때린 뒤 팔이 몸 앞으로 계속 내려와야 공에 회전과 각도가 실린다.
      타점에서 멈추면 네트에 걸리거나 공이 죽는다.
    measured_by: [swing_shoulder_flexion_after_impact_deg]
    titles:
      2: "끝까지 내리친 팔"
      1: "짧은 마무리"
      0: "멈춘 스윙"
    grades:
      2: "타점 후 어깨 굴곡이 25도 이상 추가 진행"
      1: "10~25도"
      0: "10도 미만"
    bands:
      metric: swing_shoulder_flexion_after_impact_deg
      2: [[25, null]]
      1: [[10, 25]]
      0: [[null, 10]]
    anchors:
      - measured: {swing_shoulder_flexion_after_impact_deg: 38.0}
        grade: 2
        evidence: "타점 후 어깨 굴곡 38도 추가 진행, 끝까지 내리쳤다"
      - measured: {swing_shoulder_flexion_after_impact_deg: 15.0}
        grade: 1
        evidence: "추가 굴곡 15도로 마무리가 짧다"
      - measured: {swing_shoulder_flexion_after_impact_deg: 4.0}
        grade: 0
        evidence: "추가 굴곡 4도로 타점 직후 스윙이 멈췄다"

  - id: takeoff_extension
    name: 도약 신전
    weight: 0.2
    rationale: >-
      타점에서 다리가 펴져 있어야 도약을 다 쓴 것이다. 무릎이 접힌 채
      때리면 최고점보다 낮은 자리에서 공을 만나게 된다.
    measured_by: [swing_knee_angle_at_impact]
    titles:
      2: "다 쓴 도약"
      1: "덜 쓴 도약"
      0: "접힌 도약"
    grades:
      2: "타점에서 무릎각 160도 이상"
      1: "140~160도"
      0: "140도 미만"
    bands:
      metric: swing_knee_angle_at_impact
      2: [[160, null]]
      1: [[140, 160]]
      0: [[null, 140]]
    anchors:
      - measured: {swing_knee_angle_at_impact: 170.0}
        grade: 2
        evidence: "타점에서 무릎각 170도로 도약을 끝까지 썼다"
      - measured: {swing_knee_angle_at_impact: 150.0}
        grade: 1
        evidence: "무릎각 150도로 신전이 덜 끝난 채 타점 도달"
      - measured: {swing_knee_angle_at_impact: 130.0}
        grade: 0
        evidence: "무릎각 130도로 다리가 접힌 채 때렸다"

deferred:
  - id: contact_point
    name: 타점 위치 (공 대비)
    blocked_by: >-
      배구공은 COCO의 sports_ball로 검출되지만, 타점 순간은 손과 공이 붙어 있어
      분리 시점을 잡을 수 없다. 농구 레이업에서 같은 한계를 확인했다.
  - id: approach_steps
    name: 조주 스텝
    blocked_by: "지면 접촉 시점 검출 필요 — 스텝 수와 리듬을 셀 수 없다."

grade_bands:
  A: 85
  B: 70
  C: 50
  D: 0
