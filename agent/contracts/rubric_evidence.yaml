    follow_through:
      biomechanical_basis:
        level: cited_verified
        citation: >-
          Petrolo 외. Kinematic Determinants of the Instep Soccer Kick in Elite
          Adult Soccer Players: A Systematic Review. 🔴 **미간행 원고**(학술지
          게재 표기 없음, OSF 등록 2022-10-27). 리뷰 본문 65쪽 열람.
          https://doi.org/10.17605/OSF.IO/Q2UBJ (열람 2026-09-12)
        citation_verified: true
        note: >-
          🔴 **두 차례 외부 검토가 「근거가 가장 약한 자리」로 지목했던 곳인데
          숫자가 처음 붙었다 (2026.09.12, 미결 34번).** 리뷰 본문이 엘리트
          남자의 접촉 시 고관절 굴곡 `6.4 ± 11.1 ~ 28 ± 9도` 와 팔로스루 끝
          `97 ± 16도` 를 함께 보고한다 — **추가 굴곡 69~91도**다.
          **방향은 문헌이 지지한다**(임팩트 뒤 고관절 굴곡이 크게 더 진행된다).
          🔴 **크기는 우리가 크게 낮게 잡았다** — 우리 2등급 문턱이
          `30도 이상`이라 **엘리트는 사실상 전원 2등급**이고, 문헌 값의 1/3
          자리에 금이 그어져 있다. 변별이 안 된다는 뜻이지 틀렸다는 뜻은
          아니다(생활체육 표본은 엘리트가 아니다). 🔴 **문턱을 안 옮겼다** —
          시점(`extension_peak` 대 접촉)이 먼저 풀려야 하고, 이 지표는
          `event_validity` 에 직접 얹혀 있다.
      threshold_validity: {level: unverified}
    plant_foot_position:
      biomechanical_basis:
        level: cited_verified
        citation: >-
          Kapidžić 외 (2014). Kinematic Analysis of the Instep Kick in Youth
          Soccer Players. J Hum Kinet 42:81–90. **원 논문 전문**(PMC 공개)
          열람. https://doi.org/10.2478/hukin-2014-0063 (열람 2026-09-12)
        citation_verified: true
        note: >-
          검토가 support/plant leg position 을 연구에서 분석되는 대상으로
          들었고, 🔴 **이 회차에서 원 논문 전문을 열었다 (2026.09.12, 미결
          34번).** 13세 유소년 13명(2대 300Hz)의 지지발–공 거리
          `14.13 ± 7.43 cm`. 리뷰 본문은 엘리트 값을 더 준다 — 남자 `0.27 m`
          (Navandar 2018) · 여자 `x축 0.33 ± 0.07 m`(Ruscello 2020).
          🔴 **엘리트 성인 둘 다 우리 1등급이다** — 우리 2등급 상한이
          어깨너비 0.5배(루브릭이 약 20cm 로 환산)라 27~33cm 는
          「어긋난 디딤 자리」가 된다. **유소년만 2등급이다.**
          🔴 **비교 자체에 한계가 둘 있다.** ⑴ 문헌은 **cm** 이고 우리는
          **어깨너비 배수**라, 어깨가 좁은 아이는 같은 cm 가 더 큰 배수가 되어
          **방향이 뒤집힐 수도 있다** · ⑵ 축이 안 맞는다 — Kapidžić 는
          *foot posterior displacement* 로 **앞뒤**를 가리키는 듯하고 Ruscello
          는 x·y 를 나눠 보고하는데, 우리 값은 **이미지 수평 성분**이라 측면
          촬영에서는 앞뒤·정면에서는 좌우로 읽힌다.
          🔴 **공개 지도 자료는 이 수치화 자체를 권하지 않는다** —
          Harves(CoachingAmericanSoccer.com, 열람 2026-09-12): *"Some coaches
          have tried to quantify the distance in inches that the plant foot
          should be placed to the side of the ball. This is not recommended."*
          **우리가 하는 일이 정확히 그 수치화다.** 지도자 검수(미결 ho 2번)
          에서 가장 먼저 물어볼 자리로 올려 두었다.
      threshold_validity: {level: unverified}
