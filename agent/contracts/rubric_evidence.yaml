# 루브릭 근거·검증 상태 — 4축 정본
#
# 🔴 **여기는 「검증됐다」를 적는 곳이 아니라 「어디까지 됐는지」를 적는 곳이다.**
#
# 외부 검토가 두 번(2026-09-09 · 2026-09-10) 같은 말을 했다:
#   ① 동작 선택의 생체역학적 방향성은 상당 부분 타당하지만
#   ② YAML 의 점수 구간·임계값·임팩트 이벤트까지 검증된 상태는 아니다
# 둘을 갈라 보라는 것이고, 이 파일이 그 분리를 **기계로 강제한다**
# (`tests/test_rubric_evidence.py`). 미결 `ho` 36번의 「다음」이다.
#
# 🔴 **4축은 서로 다른 층에 산다.** 평면으로 적으면 같은 판정이 복사돼
#    한쪽만 낡는다(이 저장소가 미결 10번에서 겪은 형태다).
#
#      측정 타당성  → **지표**의 성질   (`hip_rotation_range_deg` 문제는
#                                        그것을 쓰는 세 루브릭에 다 있다)
#      이벤트 타당성 → **루브릭**의 성질 (`kinematics.impact_event` 가 정한다)
#      생체역학 근거 → **세부기준**의 성질
#      임계값 타당성 → **세부기준**의 성질
#
# 🔴 **인용을 여기 적지 않는다.** 외부 검토가 PubMed 링크를 여럿 달아 왔지만
#    **원문을 열어 확인하지 않았다.** 미검증 인용을 정본에 박으면 「출처 없음」
#    보다 나쁘다 — 없는 근거를 있다고 말하는 것이 된다. 그래서 `citation` 은
#    `citation_verified: true` 없이는 **검사가 거부한다**. 확인한 사람이
#    둘을 함께 넣는다. (미결 36번 「하지 말 것」)
#
# 🔴 **이 파일을 근거로 임계값을 옮기지 않는다.** 외부 검토는 AI 단독 판독이고,
#    「분포에 맞춰 긋는 길」은 미결 34번에서 이미 기각됐다.
#
# 🔴 `rubrics/` 안에 두지 않는다 — `discover_rubrics` 가 그 폴더의 `*.yaml` 을
#    전부 루브릭으로 읽어 배포에서 죽는다 (2026.09.09 에 한 번 겪었다).

schema_version: 1

# --- 닫힌 어휘 -------------------------------------------------------------
# 🔴 「검증됨(verified)」이 **없다.** 이 프로젝트에 그렇게 말할 수 있는 축이
#    아직 하나도 없어서다. 어휘에 없으면 잘못 적을 수도 없다.
levels:
  measured_internal: >-
    우리 측정으로 확인했다. 정답 라벨이 아니라 내부 측정이므로 「맞다」가
    아니라 「이 표본에서 이렇게 나왔다」다.
  refuted_internal: >-
    우리 측정이 **결함을 보였다.** 부정적 결론이라 AI 판독으로도 설 수 있다.
  cited_unverified: >-
    외부 검토가 문헌을 들었으나 **우리가 원문을 확인하지 않았다.**
    근거로 인용하지 않는다 — 「그렇게 주장하는 검토를 받았다」까지다.
  unverified: >-
    아무 근거도 대조하지 않았다. 지금 대다수가 여기다.
  blocked: >-
    판정하려면 정답이 필요한데 그 경로가 닫혀 있다. 무엇이 막고 있는지를
    `blocked_by` 에 적는다.

axis_layer:
  biomechanical_basis: criterion
  measurement_validity: metric
  event_validity: rubric
  threshold_validity: criterion

# --- 전 항목에 걸리는 것 ---------------------------------------------------
global:
  - id: fps_dependence
    level: refuted_internal
    axis: measurement_validity
    note: >-
      같은 영상을 다른 프레임레이트로 넣으면 **최종 등급이 37% 바뀐다**
      (외부 포즈 모의). 실영상 재인코딩으로는 총점 평균 17.1점·최악 38점·
      등급 29% 변동이다. **이것은 어느 한 지표의 문제가 아니라 전 지표에
      걸린다** — 아래 지표별 판정은 이 위에서 읽어야 한다.
    evidence: 미결 ho 7번 · eval/pending7_fps/ · eval/pending7_realfps/
  - id: band_upper_bound_leak
    level: refuted_internal
    axis: threshold_validity
    note: >-
      **6개 루브릭 30개 항목이 전부 상한이 닫혀 있다.** 구간을 넘긴 값이
      0등급으로 나가 **측정 실패가 감점이 된다** — 0등급 117건 중 23건(20%)이
      구간 **위**에서 왔다. 표시(`out_of_band`)만 붙였고 점수는 안 바꿨다.
      🔴 임계값 **숫자**의 문제가 아니라 **구간 표현**의 문제다.
    evidence: 미결 ho 20번 · eval/pending20_band_floor/
  - id: no_grade_ground_truth
    level: blocked
    axis: threshold_validity
    blocked_by: 지도자 검수자 미확보 (미결 ho 2번 · min 4번)
    note: >-
      임계값은 전부 **지도자 검수 전 임시값**이다. QWK·MAE 는 사람 라벨이
      없으면 아예 못 낸다. 「(A) 임계값 검수」는 지도자 1명이면 적은 수로
      지금 시작할 수 있다고 회신해 두었다.
    evidence: 미결 ho 2번 · ho 34번

# --- 지표별: 측정 타당성 ---------------------------------------------------
# 🔴 단위를 이름에서 유추하지 말 것 — `swing_elbow_angle_at_impact` 는
#    `_deg` 가 없는데 각도이고, `plant_foot_to_ball_offset` 은 픽셀이 아니라
#    **어깨너비 배수**다.
metrics:
  swing_elbow_angle_at_impact:
    measurement_validity:
      level: refuted_internal
      note: >-
        구간 **하한이 6.8도**다 — 그 아래로는 실측이 안 내려가는데 0등급
        구간이 거기까지 열려 있다. 팔꿈치가 무릎보다 나쁘다.
      evidence: 미결 ho 20번 · eval/pending20_band_floor/
  support_elbow_angle_at_impact:
    measurement_validity:
      level: refuted_internal
      note: >-
        🔴 **전 지표 중 최악이다 — 하한 2.2도.** 항목이 적어 둔 5.4도보다
        나쁘다. 반대쪽 팔은 가려지기 쉬워 더 그렇다.
      evidence: 미결 ho 20번 · eval/pending20_band_floor/
  hip_rotation_range_deg:
    measurement_validity:
      level: refuted_internal
      note: >-
        🔴 **회전의 일부(24%)만 담는다.** 골반 좌우 키포인트 사이 각도를
        쓰는데 그것이 **카메라 축을 함께 채점한다** — 같은 회전이라도 촬영
        방향이 바뀌면 값이 바뀐다. 실클립 n=4 로는 지표 문제인지 포즈
        품질인지 못 가른다. 못 잰 것을 0.0 으로 지어내던 결함은 해소했다
        (키를 안 넣는다).
      evidence: 미결 ho 22번 · ho 21번 · eval/pending21_hip_rotation/
  swing_knee_angle_at_impact:
    measurement_validity:
      level: measured_internal
      note: >-
        무릎은 **깨끗한 편이다** — JHMDB 46편에서 95.6도 이상으로만 나온다.
        하한이 낮게 관측된 것은 실클립 4건뿐이다. 🔴 상한 쪽은
        `band_upper_bound_leak` 이 그대로 걸린다.
      evidence: 미결 ho 20번 · eval/pending20_band_floor/
  plant_knee_angle_at_impact:
    measurement_validity:
      level: unverified
      note: >-
        무릎 관절이라 `swing_knee_angle_at_impact` 와 같은 계열로 보이지만
        **디딤발 쪽은 따로 재 본 적이 없다.** 스윙 측과 달리 임팩트 프레임
        정의에 쓰이지 않아 가림 조건이 다르다.
  hip_shoulder_separation_deg:
    measurement_validity:
      level: unverified
      note: >-
        골반축과 어깨축의 각도 차이라 `hip_rotation_range_deg` 와 **같은
        카메라 축 문제를 공유할 가능성이 크다.** 🔴 그런데 재 본 적이 없다 —
        22번은 골반 회전만 쟀다. 추정으로 판정을 적지 않는다.
  trunk_forward_lean_deg_at_impact:
    measurement_validity:
      level: refuted_internal
      note: >-
        🔴 **촬영 방향을 함께 채점한다 — 쟀다 (2026.09.10, 미결 37번).**
        `arctan2(trunk[0], -trunk[1])` 이고 `normalize()` 가 방향을 정규화하지
        않아, 좌우가 반전되면 각도가 **정확히 `-θ`** 다. 「앞으로 기울었나」가
        아니라 **「이미지 오른쪽으로 기울었나」**를 잰다.
        크기: 축구 인스텝(active) 18클립에서 항목 등급 **18/18(100%)** ·
        최종 등급 **8/18(44%)** 변동, 총점 평균 **12.7점**(3장 허용치 3점의
        4.2배). 🔴 **가정이 아니라 이미 나고 있다** — 원 실측의 부호가
        인스텝 음수 8 : 양수 10, 타격 20 : 24 로 갈려 있다.
        ✅ 야구 타격은 밴드가 **0 대칭**이라 **0/46** 이다 — 같은 지표,
        더 큰 부호 분산, 밴드 하나 차이로 0% 대 44%.
        🔴 **투구·인사이드 패스는 표본 0이라 못 쟀다**(「안 난다」가 아니다).
        투구는 밴드가 6종 중 가장 비대칭이다.
        ⚠️ 2026-09-10 외부 검토는 여기에 더해 **측방(contralateral) 기울기·
        어깨 외전과 함께 보지 않으면 한 각도로 좋다/나쁘다를 못 정한다**고
        지적했다 (미확인 인용이라 근거로 쓰지 않는다).
      evidence: 미결 ho 37번 · eval/pending37_trunk_mirror/
  swing_shoulder_flexion_after_impact_deg:
    measurement_validity:
      level: unverified
      note: >-
        임팩트 **뒤** 구간을 재므로 `event_validity` 에 직접 얹혀 있다 —
        임팩트 프레임이 밀리면 이 값이 통째로 밀린다. 실클립에서 109.2도짜리
        가짜 값이 나온 적이 있다(타격 루브릭 rationale 에 기록).
  swing_hip_flexion_after_impact_deg:
    measurement_validity:
      level: unverified
      note: 위와 같다 — 임팩트 뒤 구간이라 이벤트 타당성에 얹혀 있다.
  plant_foot_to_ball_offset:
    measurement_validity:
      level: unverified
      note: >-
        🔴 **단위가 어깨너비 배수다**(픽셀이 아니다). 그리고 **정지한 공을
        전제한 기하**라 야구 타격처럼 날아오는 공에는 그대로 못 쓴다 —
        타격의 `bat_path` 가 보류된 사유 중 하나가 이것이다.
  follow_through_duration_frames:
    measurement_validity:
      level: refuted_internal
      note: >-
        🔴 **프레임 단위라 fps 에 직접 종속된다.** 같은 동작이 30fps 와
        60fps 에서 다른 값을 낸다 — `fps_dependence` 의 가장 직접적인 사례다.
        결과 봉투에 `timebase` 로 초 환산을 붙여 **드러내는 데까지** 했고,
        지표 자체는 안 고쳤다(고치면 B-6 재실행을 부른다).
      evidence: 미결 ho 7번 · 로드맵 ② E-3

# --- 루브릭별: 이벤트 타당성 -----------------------------------------------
# `extension_peak` = 스윙 관절 **신전 각속도**가 최대인 프레임 (`features.py`).
# 🔴 **접촉·릴리스 프레임이 아니다.** 둘이 같다는 근거가 우리에게 없다.
rubrics:
  baseball/batting:
    status: draft
    impact_event: extension_peak
    event_validity:
      level: refuted_internal
      note: >-
        🔴 **접촉이 아니라 신전 중간을 잡는다** — YAML 헤더가 이미 그렇게
        적고 있다. 더 결정적인 내부 근거가 있다: 결측 오염을 제거하고 다시
        뽑으면 argmax 가 **중앙 33프레임**(야구 impact 84.3% 이동) 옮겨간다.
        **전처리 선택 하나로 임팩트가 이만큼 움직인다는 뜻**이고, 어느 쪽이
        옳은지는 접촉 프레임 정답이 있어야 말할 수 있다.
      blocked_by: 접촉 프레임 정답 없음 (미결 ho 5번 — 보류, 외부 경로 전부 닫힘)
      evidence: 미결 ho 5번 · ho 13번 · eval/phaseA/eval_b7_a1_ground_truth/
  baseball/pitching:
    status: active
    impact_event: extension_peak
    event_validity:
      level: refuted_internal
      note: >-
        타격과 같다 — 릴리스가 아니라 신전 중간을 잡는다(YAML 헤더). 결측
        오염 제거 시 argmax 이동도 같은 계열이다.
      blocked_by: 릴리스 프레임 정답 없음 (미결 ho 5번 — 보류)
      evidence: 미결 ho 5번 · ho 13번
  basketball/jump_shot:
    status: active
    impact_event: extension_peak
    event_validity:
      level: refuted_internal
      note: >-
        타격·투구와 같다(YAML 헤더). 🔴 여기엔 하나가 더 붙는다 — **손목이
        가장 어려운 관절**이라 팔 유효 프레임이 96%로 통과해도 팔꿈치각이
        25도↔178도로 튄다. 그래서 팔은 신뢰도 문턱을 0.6 으로 따로 뒀다.
      blocked_by: 릴리스 프레임 정답 없음 (미결 ho 5번 — 보류)
      evidence: 미결 ho 5번 · features.py MIN_CONFIDENCE 주석
  basketball/layup:
    status: draft
    impact_event: distal_apex
    event_validity:
      level: measured_internal
      note: >-
        ✅ **6종 중 유일하게 이벤트를 실클립으로 갈랐다.** `extension_peak` 은
        팔을 들기 시작하는 **6프레임**을 잡았고 실제 릴리스는 손이 최고점인
        **21프레임**이었다 — 그래서 `distal_apex` 로 바꿨다. 🔴 다만 **눈으로
        본 것이라 AI 단독 판독**이다. 「extension_peak 이 틀렸다」는 부정적
        결론으로는 서지만, 「distal_apex 가 맞다」로는 승격하지 않는다.
      evidence: features.py IMPACT_EVENTS 주석
  football/inside_pass:
    status: draft
    impact_event: extension_peak
    event_validity:
      level: unverified
      note: >-
        🔴 **팔 종목의 진단을 그대로 옮기지 않는다.** 다리는 무릎 신전
        각속도이고 임팩트 전후 구조가 팔과 다르다 — 루브릭 자신이 임팩트
        시점을 **완전 신전 전**(140~165도)으로 잡고 있어, 각속도 피크와
        접촉의 관계가 팔 종목과 같은 방향인지 **재 본 적이 없다.**
      blocked_by: 접촉 프레임 정답 없음 (축구 표본 확대도 닫힌 경로 — 상한 38건)
  football/instep_shot:
    status: active
    impact_event: extension_peak
    event_validity:
      level: unverified
      note: 인사이드 패스와 같다 — 다리 종목의 이벤트 타당성은 안 쟀다.
      blocked_by: 접촉 프레임 정답 없음

# --- 세부기준별: 생체역학 근거 · 임계값 타당성 ------------------------------
# 🔴 `threshold_validity` 는 **전부 `unverified`** 다. 예외가 없다 —
#    지도자 검수 전 임시값이고, 여기에 `band_upper_bound_leak` 가 겹친다.
#    한 항목만 다르게 적고 싶어지면 그때가 사전 등록을 받을 때다.
criteria:
  baseball/batting:
    lead_arm_extension:
      biomechanical_basis: {level: unverified}
      threshold_validity: {level: unverified}
    hip_shoulder_separation:
      biomechanical_basis:
        level: cited_unverified
        note: >-
          2026-09-10 외부 검토가 「타격 분석에서 hip–shoulder separation /
          pelvis rotation 을 보는 것은 충분히 의미가 있다」고 했다.
          **원문 미확인.**
      threshold_validity: {level: unverified}
    hip_rotation:
      biomechanical_basis:
        level: cited_unverified
        note: 위와 같은 검토. **원문 미확인.**
      threshold_validity: {level: unverified}
    trunk_posture:
      biomechanical_basis: {level: unverified}
      threshold_validity: {level: unverified}
    follow_through:
      biomechanical_basis: {level: unverified}
      threshold_validity: {level: unverified}
  baseball/pitching:
    release_arm_extension:
      biomechanical_basis:
        level: cited_unverified
        note: >-
          검토가 투구 biomechanics 의 주요 요소로 elbow extension 을 들었다.
          **원문 미확인.**
      threshold_validity: {level: unverified}
    hip_shoulder_separation:
      biomechanical_basis:
        level: cited_unverified
        note: >-
