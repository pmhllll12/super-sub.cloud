    hip_rotation:
      biomechanical_basis:
        level: cited_unverified
        note: >-
          검토가 pelvis rotation 을 분석 대상으로 들었다. **원문 미확인.**
          🔴 근거가 좋아도 **측정 쪽이 반증됐다**(회전의 24%만 담는다) —
          축이 다르면 판정도 다르다는 것을 보여 주는 자리다.
