      biomechanical_basis:
        level: cited_unverified
        note: >-
          검토가 trunk movement 를 분석 대상으로 들었다. **원문 미확인.**
          🔴 **찾았지만 쓸 수 없었다 — 문헌이 다른 것을 잰다 (2026.09.12,
