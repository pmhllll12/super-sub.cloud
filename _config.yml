# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: 멀티모달 용병 스카우팅 & RAG 검증 플랫폼
email: pmhllll12@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  생활체육 경기 영상을 멀티모달로 분석하여 용병을 구인하고 RAG 검증을 자동화하는
  플랫폼(Hit Rate 90%, Recall@5 90% 달성) 개발 제안서입니다.
baseurl: "" # dev.supersub-ai.com 루트에 배포하므로 서브패스 없음
url: "https://dev.supersub-ai.com" # the base hostname & protocol for your site, e.g. http://example.com
github_username:  pmhllll12

# Build settings
theme: just-the-docs
plugins:
  - jekyll-feed

# Just the Docs 테마 설정 (dev.life-tutorial.com과 동일 테마)
color_scheme: light
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "위로"
nav_sort: case_sensitive # 각 페이지의 nav_order 값을 그대로 따름

aux_links:
  "GitHub":
    - "https://github.com/pmhllll12/super-sub.cloud"
aux_links_new_tab: true

footer_content: "Copyright &copy; 2026 Super-Sub"

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# demo/ is a separate, self-contained Jekyll site (its own _config.yml,
# Gemfile, layouts) kept here for reference — excluded so it doesn't get
# built or served as part of this site. supersub-preview.service is the
# systemd unit for the local preview server, not site content.
# agent/ is the Python implementation of the AI analysis agent (see
# chapter 6). flutter/ is the Flutter app implementation. fastapi/ is the
# backend API server source. All three are source code, not site
# content — excluded from the build.
exclude:
  - demo/
  - agent/
  - flutter/
  - supersub-preview.service
  - fastapi/
  - www/
  # 팀·개인용 작업 지침이라 공개 사이트에 실을 것이 아니다.
  # ⚠️ 이건 **Jekyll 발행 제외**일 뿐 git 과는 무관하다 — CLAUDE.md 는 그대로
  #    저장소에 있고 pull 하면 받는다(fastapi/ 와 같다).
  - CLAUDE.md
  - CLAUDE.local.md
