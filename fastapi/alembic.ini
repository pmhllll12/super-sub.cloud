[alembic]
script_location = alembic

# 리비전 해시만으로는 목록을 봐도 순서를 알 수 없다. 날짜를 앞에 붙인다.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(slug)s

# sqlalchemy.url 은 **일부러 비워 둔다.** alembic/env.py 가 .env 의 DATABASE_URL 을
# 읽어 넣는다. 여기 적으면 접속 정보가 git 에 평문으로 올라간다.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
